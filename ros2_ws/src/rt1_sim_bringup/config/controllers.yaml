# ==============================================================================
#  FILE: rt1_sim_bringup/config/controllers.yaml
# ==============================================================================
#  Target:
#    Controller set loaded by gz_ros2_control inside Gazebo. Arm keeps the stock
#    ROBOTIS trajectory tuning; the stock position GripperActionController is
#    replaced by a direct effort controller so grip FORCE is the command.
#
#  Physics / Math Implemented:
#    Gripper command u = [F_left, F_right] in N, applied as joint effort.
#    Finger axes point outward: u < 0 closes (squeeze), u > 0 opens.
#    Against a spring plate of stiffness k, each finger settles where
#        F = k * x   ->   x = F / k
#
#  Inputs & Outputs:
#    /arm_controller/follow_joint_trajectory   action, joints 1..4 (rad)
#    /gripper_effort_controller/commands       std_msgs/Float64MultiArray,
#                                              data: [F_left, F_right] (N)
#    /joint_states                             position, velocity, effort
# ==============================================================================

# gz_ros2_control converts arm position commands into velocity commands with
# a proportional gain that scales with the controller-manager rate. CM went
# 100 -> 1000 Hz for the gripper loop, so cut the gain 10x to keep the arm's
# tracking exactly as before (time constant ~0.1 s, no stop-go jerk).
gz_ros_control:
    ros__parameters:
        position_proportional_gain: 0.01


# controller_manager runs at 1 kHz (= physics step) so the gripper centring
# loop is fast enough to be stable; slower controllers set their own rate.
controller_manager:
    ros__parameters:
        update_rate: 1000

        joint_state_broadcaster:
            type: joint_state_broadcaster/JointStateBroadcaster
        arm_controller:
            type: joint_trajectory_controller/JointTrajectoryController
        gripper_centering_controller:
            type: rt1_gripper_controller/GripperCenteringController

joint_state_broadcaster:
    ros__parameters:
        update_rate: 100          # keep /joint_states at 100 Hz (not 1 kHz)

arm_controller:
    ros__parameters:
        update_rate: 100
        joints: [joint1, joint2, joint3, joint4]
        command_interfaces: [position]
        state_interfaces: [position, velocity]
        allow_partial_joints_goal: true

gripper_centering_controller:
    ros__parameters:
        update_rate: 1000
        left_joint: gripper_left_joint
        right_joint: gripper_right_joint
        centering_stiffness: 150.0
        centering_damping: 7.5
        max_squeeze_n: 7.0
        max_effort_n: 10.0
        initial_force_n: -1.0